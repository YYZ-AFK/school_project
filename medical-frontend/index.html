<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慧医数字医疗应用系统 - 登录</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="login-page">
  <main class="login-panel">
    <div class="login-visual">
      <img src="./assets/HomeLogo.png" alt="慧医系统" class="brand-logo">
      <h1>慧医数字医疗应用系统</h1>
      <p>医保服务与医药信息管理平台</p>
    </div>
    <form class="login-form" id="loginForm">
      <div class="login-form-head">
        <strong>账号登录</strong>
        <span id="roleHint">管理员账号可进入系统管理功能</span>
      </div>

      <div class="role-switch" role="tablist" aria-label="选择登录身份">
        <button type="button" class="role-button active" data-role="admin" aria-selected="true">管理员登录</button>
        <button type="button" class="role-button" data-role="doctor" aria-selected="false">医生登录</button>
      </div>

      <label>
        <span>账号</span>
        <input id="username" class="login-input username-input" name="username" autocomplete="username" placeholder="请输入管理员账号" required>
      </label>
      <label>
        <span>密码</span>
        <input id="password" class="login-input password-input" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      </label>

      <p class="login-tip" id="loginTip">请使用管理员分配的账号和密码登录。</p>
      <button type="submit" id="loginButton">管理员登录</button>
      <p class="form-message" id="loginMessage"></p>
    </form>
  </main>
  <script src="./login.js"></script>
</body>
</html>
