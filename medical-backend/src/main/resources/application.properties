server.port=${SERVER_PORT:8080}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/bin_text?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:607607}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.qst.medical.domain,com.qst.medical.entity,com.qst.medical.model
mybatis.configuration.map-underscore-to-camel-case=true
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.params=count=countSql
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
upload.path=./uploads/
jwt.secret=${JWT_SECRET:medical-training-secret-key-2026-medical-training-secret-key-2026}
jwt.expire=${JWT_EXPIRE:7200000}
# SpringDoc OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.qst.medical.controller
